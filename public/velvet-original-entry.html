<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet"><style>
:root{--bg0:#0f080d;--bg1:#1d0f19;--wine:#4a1d36;--rose:#d9a9bf;--rose-dim:#a9728d;--ink:#f3dfe8;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%;width:100%}body{background:var(--bg0);color:var(--ink);font-family:Jost,system-ui,sans-serif;overflow:hidden}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6vh 24px 7vh;background:radial-gradient(ellipse 80% 55% at 50% 42%,var(--wine) 0%,var(--bg1) 45%,var(--bg0) 100%)}
.grain{position:absolute;inset:0;opacity:.07;pointer-events:none;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mark{position:relative;width:min(82vw,340px);aspect-ratio:1;margin-top:auto;flex:none}.mark svg{width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:var(--rose);stroke-width:.6;opacity:.35}.dots{fill:none;stroke:var(--rose);stroke-width:1.2;stroke-dasharray:.5 7;stroke-linecap:round;opacity:.55;transform-origin:200px 200px;animation:spin 70s linear infinite}
.v{fill:none;stroke:url(#g);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(217,169,191,.55));animation:draw 2.6s cubic-bezier(.6,.05,.2,1) forwards}.v.a{stroke-width:2.2}.v.b{stroke-width:1.6;animation-delay:.35s;opacity:.8}.v.c{stroke-width:1;animation-delay:.7s;opacity:.55}
.pearl{fill:var(--rose);opacity:0;filter:drop-shadow(0 0 10px var(--rose));animation:pearl 1.6s 2.2s ease forwards}.halo{fill:none;stroke:var(--rose);opacity:0;transform-origin:200px 340px;animation:halo 4s 2.6s ease-out infinite}
.title{text-align:center;margin-top:3.5vh;opacity:0;animation:rise 1.6s 1.6s ease forwards}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(40px,13vw,58px);letter-spacing:.32em;margin-right:-.32em;line-height:1;background:linear-gradient(180deg,#fbeaf1,var(--rose) 60%,var(--rose-dim));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:14px;font-weight:300;font-size:13px;letter-spacing:.55em;margin-right:-.55em;color:var(--rose-dim)}
.tag{margin-top:22px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;color:rgba(243,223,232,.7)}
.cta{margin-top:auto;position:relative;opacity:0;animation:rise 1.4s 2.4s ease forwards;padding-top:4vh}
button{position:relative;overflow:hidden;font:400 15px Jost,sans-serif;letter-spacing:.4em;padding:18px 54px 18px 58px;color:var(--ink);background:linear-gradient(135deg,rgba(217,169,191,.14),rgba(74,29,54,.35));border:1px solid rgba(217,169,191,.5);border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 0 40px rgba(217,169,191,.12),inset 0 0 18px rgba(217,169,191,.08);transition:transform .25s,box-shadow .25s}
button::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:shine 4.5s 3.5s infinite}button:active{transform:scale(.96)}button:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
.veil{position:absolute;inset:0;background:var(--bg0);opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:26px;color:var(--rose);letter-spacing:.08em;transition:opacity .9s ease}.veil.on{opacity:1;pointer-events:auto}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pearl{to{opacity:1}}@keyframes halo{0%{opacity:.6;transform:scale(.2)}100%{opacity:0;transform:scale(3)}}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style></head><body><main class="stage"><div class="grain"></div><canvas id="p" aria-hidden="true"></canvas><div class="mark" aria-hidden="true"><svg viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeaf1"/><stop offset="1" stop-color="#c58aa6"/></linearGradient></defs><circle class="ring" cx="200" cy="200" r="198"/><circle class="ring" cx="200" cy="200" r="168" style="opacity:.2"/><circle class="ring" cx="200" cy="200" r="132" style="opacity:.5"/><circle class="dots" cx="200" cy="200" r="105"/><path class="v a" pathLength="1" d="M96 112 L200 330 L304 112"/><path class="v b" pathLength="1" d="M122 112 L200 276 L278 112"/><path class="v c" pathLength="1" d="M148 112 L200 222 L252 112"/><circle class="halo" cx="200" cy="330" r="14" stroke-width=".8"/><circle class="pearl" cx="200" cy="330" r="5.5"/></svg></div><div class="title"><h1>VELVET</h1><div class="sub">STORIES</div><p class="tag">Historias que se sienten.</p></div><div class="cta"><button id="go" type="button">ENTRAR</button></div><div class="veil" id="veil" role="status">Bienvenida a Velvet</div></main>
<script>(function(){var c=document.getElementById('p'),x=c.getContext('2d'),W,H,pts=[],dpr=Math.min(window.devicePixelRatio||1,2);function size(){W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();window.addEventListener('resize',size);for(var i=0;i<38;i++)pts.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,s:Math.random()*.00006+.00002,a:Math.random()*6.28});var calm=window.matchMedia('(prefers-reduced-motion:reduce)').matches;function tick(t){x.clearRect(0,0,W,H);pts.forEach(function(p){if(!calm)p.y-=p.s*16;if(p.y<-.02)p.y=1.02;var px=p.x*W+Math.sin(t*.0004+p.a)*10,py=p.y*H,al=.15+.35*Math.abs(Math.sin(t*.0008+p.a));x.beginPath();x.arc(px,py,p.r,0,6.28);x.fillStyle='rgba(235,190,212,'+al+')';x.shadowBlur=8;x.shadowColor='rgba(235,190,212,.6)';x.fill()});if(!calm)requestAnimationFrame(tick)}requestAnimationFrame(tick);document.getElementById('go').addEventListener('click',function(){document.getElementById('veil').classList.add('on');window.parent.postMessage({type:'velvet-original-entry-enter'},window.location.origin)})})();</script></body></html>
