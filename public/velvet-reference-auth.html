<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Sora:wght@200;300&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#130a11;--bg1:#1c0f18;--wine:#3f1a2b;--rose:#c795ae;--dim:#8f6a80;--gold:#dcb3c6;--ink:#ead3de;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
  --x:50%;--y:42%;--px:0;--py:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{height:100%;background:var(--bg0);color:var(--ink);font-family:"Sora",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
.stage{position:relative;height:100%;overflow:hidden;background:radial-gradient(ellipse 85% 55% at 50% 42%,var(--wine) 0%,var(--bg1) 48%,var(--bg0) 100%)}
.spot{position:absolute;inset:0;background:radial-gradient(circle 240px at var(--x) var(--y),rgba(220,179,198,.16),transparent 70%);pointer-events:none;transition:background .1s}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.6) 100%);pointer-events:none}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wisps{position:absolute;inset:-5%;width:110%;height:110%;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.wisps path{fill:none;stroke:var(--rose);stroke-width:.7;opacity:.18}
.ui{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:5vh 24px 6vh;transition:opacity .9s,transform 1.2s}
.ui.out{opacity:0;transform:scale(1.05);pointer-events:none}
.mark{width:min(84vw,350px);aspect-ratio:1;margin-top:auto;flex:none;transform:translate(calc(var(--px)*14px),calc(var(--py)*14px));transition:transform .25s ease-out}
.mark svg{width:100%;height:100%;overflow:visible;animation:breathe 6s ease-in-out infinite}
.mark.pulse svg{animation:pulse 1.2s ease-out}
.ring{fill:none;stroke:var(--rose);stroke-width:.6;opacity:.35}
.ticks{fill:none;stroke:var(--rose);stroke-width:7;stroke-dasharray:.7 11.3;opacity:.3;transform-origin:200px 200px;animation:spin 120s linear infinite}
.dots{fill:none;stroke:var(--rose);stroke-width:1.2;stroke-dasharray:.5 7;stroke-linecap:round;opacity:.55;transform-origin:200px 200px;animation:spin 70s linear infinite reverse}
.orbit{transform-origin:200px 200px;animation:spin 22s linear infinite}
.orbit circle{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.arc{fill:none;stroke:var(--gold);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:90 1160;opacity:.8;transform-origin:200px 200px;animation:spin 9s linear infinite reverse}
.v{fill:none;stroke:url(#g);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 7px rgba(199,149,174,.55));animation:draw 2.4s cubic-bezier(.6,.05,.2,1) .2s forwards}
.v.a{stroke-width:2.4}.v.b{stroke-width:1.6;animation-delay:.5s;opacity:.8}.v.c{stroke-width:1;animation-delay:.8s;opacity:.55}
.sweep{fill:none;stroke:#f0d4e0;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.06 1;stroke-dashoffset:.06;opacity:0;filter:drop-shadow(0 0 5px #e8c3d4);animation:sweep 5s 3s ease-in-out infinite}
.pearl{fill:var(--gold);opacity:0;filter:drop-shadow(0 0 10px var(--rose));animation:fade 1.4s 2.4s forwards}
.halo{fill:none;stroke:var(--rose);opacity:0;transform-origin:200px 340px;animation:halo 4s 2.8s ease-out infinite}
.title{text-align:center;margin-top:3vh;transform:translate(calc(var(--px)*-6px),calc(var(--py)*-6px));transition:transform .25s ease-out}
h1{font-family:"Italiana",Georgia,serif;font-weight:400;font-size:clamp(44px,14.5vw,64px);line-height:1;letter-spacing:.3em;margin-right:-.3em;display:flex;justify-content:center}
h1 span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(12px);animation:letter 1.3s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(1.6s + var(--i)*.11s);
  background:linear-gradient(180deg,#e8c3d4,var(--rose) 70%,var(--dim));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:14px;font-weight:200;font-size:11px;letter-spacing:.7em;color:var(--dim);opacity:0;animation:sub 1.8s 2.4s ease forwards}
.sub::before,.sub::after{content:"";height:1px;width:34px;background:linear-gradient(90deg,transparent,var(--dim))}
.sub::after{transform:scaleX(-1)}
.cta{margin-top:auto;opacity:0;animation:rise 1.2s 2.8s ease forwards}
.enter{position:relative;border:0;cursor:pointer;color:var(--ink);font:300 13px "Sora",sans-serif;letter-spacing:.5em;padding:19px 34px 19px 44px;display:flex;align-items:center;gap:20px;
  --c:14px;clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));
  background:linear-gradient(120deg,var(--rose),var(--wine) 40%,var(--gold) 55%,var(--wine) 70%,var(--rose));background-size:250% 100%;animation:edge 5s linear infinite;transition:transform .2s}
.enter::before{content:"";position:absolute;inset:1px;z-index:0;background:linear-gradient(160deg,#2a1422,#150a12);
  clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.enter>*{position:relative;z-index:1}
.ln{width:26px;height:1px;background:var(--rose);position:relative;transition:width .35s}
.ln::after{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid var(--rose);border-right:1px solid var(--rose);transform:rotate(45deg) translate(-1px,1px)}
.enter:hover .ln,.enter:active .ln{width:40px}
.enter:active{transform:scale(.96)}
.enter:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
.hello{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Italiana",Georgia,serif;font-size:34px;letter-spacing:.18em;color:var(--gold);opacity:0;pointer-events:none;transition:opacity .9s .5s}
.hello.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sweep{0%{opacity:0;stroke-dashoffset:.06}10%{opacity:.9}60%{opacity:.9}70%,100%{opacity:0;stroke-dashoffset:-1}}
@keyframes fade{to{opacity:1}}
@keyframes halo{0%{opacity:.6;transform:scale(.2)}100%{opacity:0;transform:scale(3)}}
@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
@keyframes sub{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.025)}}
@keyframes pulse{40%{transform:scale(1.1);filter:brightness(1.5)}}
@keyframes drift{to{transform:translate(2%,-3%) rotate(1deg)}}
@keyframes edge{to{background-position:-250% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
#login .app{height:100%;display:flex;flex-direction:column;position:relative;transition:opacity .9s,transform 1.2s}
#login .app.out{opacity:0;transform:scale(1.04);pointer-events:none}
#login .hd{text-align:center;padding:5vh 24px 0;transition:padding .9s ease}
#login .vw{width:min(60vw,30vh,240px);margin:0 auto;transition:width .9s ease}
#login .vw svg{width:100%;display:block;overflow:visible}
#login .vv{fill:none;stroke:url(#g);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s cubic-bezier(.6,.05,.2,1) .2s forwards;filter:drop-shadow(0 0 6px rgba(199,149,174,.6))}
#login .vv.o{stroke-width:3.4}
#login .vv.i{stroke-width:1.4;opacity:.8;animation-delay:.6s}
#login h2{font:400 clamp(38px,12vw,52px)/1 "Italiana",Georgia,serif;letter-spacing:.3em;margin:2vh -.3em 0 0;background:linear-gradient(180deg,#e8c3d4,var(--rose) 70%,var(--dim));-webkit-background-clip:text;background-clip:text;color:transparent;transition:font-size .9s}
#login .lsub{margin-top:10px;font-weight:200;font-size:11px;letter-spacing:.7em;margin-right:-.7em;color:var(--dim);max-height:20px;transition:max-height .6s,opacity .6s}
#login .chatting .hd{padding-top:3vh}
#login .chatting .vw{width:64px}
#login .chatting h2{font-size:26px}
#login .chatting .lsub{max-height:0;opacity:0;margin-top:0}
#login .chat{flex:1;overflow-y:auto;padding:18px 20px 8px;display:flex;flex-direction:column;gap:12px;max-width:440px;width:100%;margin:0 auto;scrollbar-width:none}
#login .chat::-webkit-scrollbar{display:none}
#login .row{display:flex;gap:8px;align-items:flex-end;animation:pop .5s ease both}
#login .row.me{justify-content:flex-end}
#login .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--rose),var(--wine))}
#login .av svg{width:14px;fill:none;stroke:#2a1020;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
#login .b{max-width:78%;padding:11px 15px;border-radius:18px 18px 18px 4px;font:300 14px/1.45 "Sora";background:rgba(199,149,174,.13);border:1px solid rgba(199,149,174,.25);overflow-wrap:anywhere}
#login .me .b{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#a9748e,#6e3452);color:#fff;border:0}
#login .dotz{display:flex;gap:4px;padding:15px 16px}
#login .dotz i{width:6px;height:6px;border-radius:50%;background:var(--rose);animation:dz 1.2s infinite}
#login .dotz i:nth-child(2){animation-delay:.15s}
#login .dotz i:nth-child(3){animation-delay:.3s}
#login .foot{padding:8px 16px 14px;max-width:440px;width:100%;margin:0 auto;opacity:0;transition:opacity .8s}
#login .chatting .foot{opacity:1}
#login .bar{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 20px;border-radius:999px;background:rgba(199,149,174,.1);border:1px solid rgba(199,149,174,.4);transition:border-color .3s,transform .3s}
#login .bar:focus-within{border-color:var(--rose);box-shadow:0 0 24px rgba(199,149,174,.18)}
#login .bar.shake{animation:shake .4s}
#login input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:300 16px "Sora"}
#login input::placeholder{color:rgba(234,211,222,.4)}
#login .eye{background:none;border:0;color:var(--dim);font:300 12px "Sora";cursor:pointer;padding:6px}
#login .send{flex:none;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:19px;color:#2a1020;background:var(--rose);transition:transform .2s}
#login .send:active{transform:scale(.9)}
#login .alt{display:block;margin:10px auto 0;background:none;border:0;color:var(--dim);font:300 12px "Sora";letter-spacing:.08em;cursor:pointer;padding:6px}
#login .alt[hidden]{display:none}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes dz{40%{transform:translateY(-4px);opacity:1}0%,80%,100%{opacity:.4}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
#login{position:fixed;inset:0;z-index:6;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#login.on{opacity:1;visibility:visible}
.hello{flex-direction:column;gap:12px;text-align:center;padding:0 30px;font-size:inherit;letter-spacing:0}
.hello b{font:400 34px "Italiana",Georgia,serif;letter-spacing:.14em;color:var(--gold)}
.hello em{font:italic 500 22px "Cormorant Garamond",Georgia,serif;color:rgba(234,211,222,.82)}

.velvet-lighting{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top,14px));left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:5px;border:1px solid rgba(199,149,174,.34);border-radius:999px;background:rgba(25,13,22,.7);backdrop-filter:blur(18px)}
.velvet-lighting button{border:0;background:transparent;color:var(--dim);border-radius:999px;padding:9px 13px;font:400 11px "Sora",sans-serif;white-space:nowrap;cursor:pointer}
.velvet-lighting button[aria-pressed="true"]{background:rgba(199,149,174,.24);color:var(--ink)}
html[data-theme="light"]{--bg0:#f9f6f3;--bg1:#f5e9ed;--wine:#f0dce5;--rose:#85506c;--dim:#865d73;--gold:#78435f;--ink:#3d2734;color-scheme:light}
html[data-theme="comfort"]{--bg0:#f2e6d9;--bg1:#eddbc9;--wine:#e4c7bb;--rose:#925d69;--dim:#825e60;--gold:#714b53;--ink:#493239;color-scheme:light}
html[data-theme="light"] body,html[data-theme="comfort"] body{background:var(--bg0)}
html[data-theme="light"] .stage,html[data-theme="comfort"] .stage{background:radial-gradient(ellipse at 50% 42%,var(--wine),var(--bg1) 58%,var(--bg0))}
html[data-theme="light"] .vig,html[data-theme="comfort"] .vig{opacity:.12}
html[data-theme="light"] #login,html[data-theme="comfort"] #login{background:var(--bg0)}
html[data-theme="light"] .velvet-lighting,html[data-theme="comfort"] .velvet-lighting{background:rgba(255,250,247,.82);border-color:rgba(123,77,98,.23)}
html[data-theme="light"] #login .b,html[data-theme="comfort"] #login .b{background:rgba(133,80,108,.09);border-color:rgba(133,80,108,.2)}
html[data-theme="light"] #login .me .b,html[data-theme="comfort"] #login .me .b{background:#87546f;color:#fff}
html[data-theme="light"] #login .bar,html[data-theme="comfort"] #login .bar{background:rgba(133,80,108,.08);border-color:rgba(133,80,108,.33)}
html[data-theme="light"] #login input::placeholder,html[data-theme="comfort"] #login input::placeholder{color:rgba(73,50,57,.55)}
html[data-theme="light"] #login .send,html[data-theme="comfort"] #login .send{background:#87546f;color:#fff}


/* Contrast-corrected Velvet lighting: retain the identity, not a washed-out inversion. */
html[data-theme="light"]{--bg0:#f6f0ed;--bg1:#f0e3e8;--wine:#e8cbd7;--rose:#773b59;--dim:#80516a;--gold:#713450;--ink:#38202f}
html[data-theme="comfort"]{--bg0:#e9d8c8;--bg1:#e5ccbd;--wine:#d8adab;--rose:#753e50;--dim:#78505b;--gold:#663744;--ink:#35232a}
html[data-theme="light"] .stage{background:radial-gradient(ellipse 55% 58% at 50% 43%,#e4c5d2 0%,#f0e4e8 55%,#f6f0ed 100%)}
html[data-theme="comfort"] .stage{background:radial-gradient(ellipse 58% 65% at 50% 43%,#d8b0ad 0%,#e5cebf 55%,#ecdfd0 100%)}
html[data-theme="light"] .spot,html[data-theme="comfort"] .spot{opacity:.25}
html[data-theme="light"] .vig,html[data-theme="comfort"] .vig{opacity:.14}
html[data-theme="light"] .grain,html[data-theme="comfort"] .grain{opacity:.035}
html[data-theme="light"] .ring,html[data-theme="comfort"] .ring{stroke:#7a415d;opacity:.5}
html[data-theme="light"] .ticks,html[data-theme="comfort"] .ticks{stroke:#81405d;opacity:.55}
html[data-theme="light"] .wisps path,html[data-theme="comfort"] .wisps path{stroke:#88546b;opacity:.24}
html[data-theme="light"] .mark svg,html[data-theme="comfort"] .mark svg{filter:drop-shadow(0 8px 22px rgba(99,43,72,.16))}
html[data-theme="light"] .v,html[data-theme="comfort"] .v{stroke:#70304f!important;filter:drop-shadow(0 0 6px rgba(123,55,86,.23))}
html[data-theme="light"] h1 span,html[data-theme="comfort"] h1 span{background:linear-gradient(180deg,#59243f 0%,#7b3b5d 65%,#a0667e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 7px rgba(83,35,59,.1))}
html[data-theme="light"] .sub,html[data-theme="comfort"] .sub{color:#77465f!important}
html[data-theme="light"] .enter,html[data-theme="comfort"] .enter{color:#fff!important;border-color:#6f3652!important;background:linear-gradient(145deg,#814661,#4a2438)!important;box-shadow:0 12px 32px rgba(76,31,55,.22),inset 0 1px rgba(255,255,255,.2)!important}
html[data-theme="light"] .enter::before,html[data-theme="comfort"] .enter::before{background:linear-gradient(145deg,#814661,#4a2438)!important}
html[data-theme="light"] .enter .ln,html[data-theme="comfort"] .enter .ln{background:#f9e5ed!important}
html[data-theme="light"] .enter .ln::after,html[data-theme="comfort"] .enter .ln::after{border-color:#f9e5ed!important}
html[data-theme="light"] .velvet-lighting,html[data-theme="comfort"] .velvet-lighting{background:rgba(255,249,247,.86);border:1px solid rgba(105,51,80,.24);box-shadow:0 6px 24px rgba(72,37,55,.1)}
html[data-theme="light"] .velvet-lighting button,html[data-theme="comfort"] .velvet-lighting button{color:#78465f}
html[data-theme="light"] .velvet-lighting button[aria-pressed="true"],html[data-theme="comfort"] .velvet-lighting button[aria-pressed="true"]{background:#66354f;color:#fff;box-shadow:0 2px 10px rgba(72,29,53,.18)}
html[data-theme="light"] #login,html[data-theme="comfort"] #login{background:radial-gradient(ellipse at 50% 35%,var(--wine),var(--bg0) 80%);color:var(--ink)}
html[data-theme="light"] #login h2,html[data-theme="comfort"] #login h2{background:linear-gradient(#58263e,#955c77);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="light"] #login .vv,html[data-theme="comfort"] #login .vv{stroke:#70304f;filter:none}
html[data-theme="light"] #login .b,html[data-theme="comfort"] #login .b{background:rgba(110,55,83,.11);border-color:rgba(105,49,78,.28);color:var(--ink)}
html[data-theme="light"] #login .me .b,html[data-theme="comfort"] #login .me .b{background:#77405e;color:#fff}
html[data-theme="light"] #login .bar,html[data-theme="comfort"] #login .bar{background:rgba(255,250,248,.72);border-color:rgba(105,49,78,.4)}
html[data-theme="light"] #login .bar input,html[data-theme="comfort"] #login .bar input{color:#38202f}
html[data-theme="light"] #login .send,html[data-theme="comfort"] #login .send{background:#713b58;color:#fff}


/* Lighting refinement v3: prevent controls covering Velvet and avoid stark white. */
html[data-theme="comfort"]{--bg0:#36252c;--bg1:#493039;--wine:#62414b;--rose:#e0b4aa;--dim:#d6ada8;--gold:#e7c4b6;--ink:#f6e9dd;color-scheme:dark}
html[data-theme="light"]{--bg0:#e6d9dc;--bg1:#dbc6d0;--wine:#cfaebe;--rose:#65334f;--dim:#77445e;--gold:#713b57;--ink:#352030;color-scheme:light}
html[data-theme="comfort"] body{background:#36252c}
html[data-theme="comfort"] .stage{background:radial-gradient(ellipse 75% 65% at 50% 40%,#6b4a51 0%,#493039 52%,#30232b 100%)}
html[data-theme="comfort"] #login{background:radial-gradient(ellipse 85% 70% at 50% 30%,#58404a 0%,#36252c 78%,#2b2028 100%);color:#f6e9dd}
html[data-theme="comfort"] .vig{opacity:.45}
html[data-theme="comfort"] .spot{opacity:.7}
html[data-theme="comfort"] .ring,html[data-theme="comfort"] .ticks,html[data-theme="comfort"] .dots{stroke:#e0b4aa;opacity:.55}
html[data-theme="comfort"] .v{stroke:#e7b8bc!important;filter:drop-shadow(0 0 9px rgba(240,182,188,.3))}
html[data-theme="comfort"] h1 span,html[data-theme="comfort"] #login h2{background:linear-gradient(180deg,#f9e3df,#dfadaf 72%,#c88f9f);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="comfort"] .sub,html[data-theme="comfort"] #login .lsub{color:#e2b9b3!important}
html[data-theme="comfort"] .enter{background:linear-gradient(135deg,#e0b7b2,#ac798c)!important;color:#2e1926!important;border-color:#d8b0ad!important}
html[data-theme="comfort"] .enter::before{background:linear-gradient(135deg,#e6c3ba,#b98698)!important}
html[data-theme="comfort"] .enter .ln{background:#512b3d!important}
html[data-theme="comfort"] .enter .ln::after{border-color:#512b3d!important}
html[data-theme="comfort"] #login .b{background:rgba(240,201,197,.12);border-color:rgba(240,201,197,.26);color:#f6e9dd}
html[data-theme="comfort"] #login .me .b{background:#b67e92;color:#fff}
html[data-theme="comfort"] #login .bar{background:rgba(245,220,213,.1);border-color:rgba(245,220,213,.4)}
html[data-theme="comfort"] #login .bar input{color:#fff5ef}
html[data-theme="comfort"] #login .bar input::placeholder{color:#d4b6b5}
html[data-theme="comfort"] #login .send{background:#e0b4aa;color:#38212c}
html[data-theme="comfort"] .velvet-lighting{background:rgba(44,29,38,.88);border-color:rgba(239,198,197,.3)}
html[data-theme="comfort"] .velvet-lighting button{color:#e4c2c0}
html[data-theme="comfort"] .velvet-lighting button[aria-pressed="true"]{background:#d8a8ae;color:#33212b}
html[data-theme="light"] body{background:#e6d9dc}
html[data-theme="light"] .stage{background:radial-gradient(ellipse 70% 60% at 50% 42%,#c9a6b8 0%,#dbc6d0 58%,#e6d9dc 100%)}
html[data-theme="light"] #login{background:radial-gradient(ellipse 85% 60% at 50% 30%,#d2b7c4 0%,#e6d9dc 78%,#eadfe1 100%)}

<body>

<nav class="velvet-lighting" aria-label="Iluminación"><button type="button" data-lighting="dark">Original</button><button type="button" data-lighting="comfort">Cómoda</button><button type="button" data-lighting="light">Blanca</button></nav>
<main class="stage" id="stage">
  <div class="spot"></div>
  <svg class="wisps" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true">
    <path d="M30 0C80 160 -20 300 20 460S90 700 60 800"/><path d="M60 0C100 180 10 320 50 470S110 690 90 800"/>
    <path d="M370 0C320 170 420 330 380 500S320 720 350 800"/><path d="M340 120C400 260 310 420 370 600"/>
  </svg>
  <canvas id="p" aria-hidden="true"></canvas>
  <div class="vig"></div><div class="grain"></div>

  <div class="ui" id="ui">
    <div class="mark" id="mark" aria-hidden="true">
      <svg viewBox="0 0 400 400">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c3d4"/><stop offset="1" stop-color="#a9748e"/></linearGradient></defs>
        <circle class="ring" cx="200" cy="200" r="198"/>
        <circle class="ticks" cx="200" cy="200" r="184"/>
        <circle class="ring" cx="200" cy="200" r="150" style="opacity:.2"/>
        <circle class="ring" cx="200" cy="200" r="132" style="opacity:.5"/>
        <circle class="dots" cx="200" cy="200" r="105"/>
        <circle class="arc" cx="200" cy="200" r="150"/>
        <g class="orbit"><circle cx="200" cy="2" r="2.6"/></g>
        <path class="v a" pathLength="1" d="M96 112 L200 330 L304 112"/>
        <path class="v b" pathLength="1" d="M122 112 L200 276 L278 112"/>
        <path class="v c" pathLength="1" d="M148 112 L200 222 L252 112"/>
        <path class="sweep" pathLength="1" d="M96 112 L200 330 L304 112"/>
        <circle class="halo" cx="200" cy="330" r="14" stroke-width=".8"/>
        <circle class="pearl" cx="200" cy="330" r="5.5"/>
      </svg>
    </div>
    <div class="title">
      <h1 aria-label="Velvet"><span style="--i:0">V</span><span style="--i:1">E</span><span style="--i:2">L</span><span style="--i:3">V</span><span style="--i:4">E</span><span style="--i:5">T</span></h1>
      <div class="sub">STORIES</div>
    </div>
    <div class="cta"><button class="enter" id="go" type="button"><span>ENTRAR</span><i class="ln"></i></button></div>
  </div>
  <div class="hello" id="hello" role="status"><b>Ya estás dentro</b><em>¿A quién quieres conocer hoy?</em></div>
</main>
<section id="login" aria-label="Crear cuenta">
<div class="app chatting" id="app">
  <header class="hd">
    <div class="vw"><svg viewBox="0 0 200 200" aria-hidden="true"><path class="vv o" pathLength="1" d="M40 44L100 160L160 44"/><path class="vv i" pathLength="1" d="M68 44L100 106L132 44"/></svg></div>
    <h2>VELVET</h2><div class="lsub">STORIES</div>
  </header>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="foot">
    <form class="bar" id="bar" autocomplete="on">
      <input id="in" required>
      <button type="button" class="eye" id="eye" hidden>ver</button>
      <button type="submit" class="send" aria-label="Enviar">↑</button>
    </form>
    <button class="alt" id="alt" type="button">Ya tengo cuenta</button>
  </div>
</div>
</section>

<script>
(function(){
  var st=document.getElementById('stage'),c=document.getElementById('p'),x=c.getContext('2d'),W,H,pts=[],ptr=null,
      dpr=Math.min(devicePixelRatio||1,2),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  for(var i=0;i<44;i++)pts.push({x:Math.random()*400,y:Math.random()*900,r:Math.random()*1.4+.4,v:Math.random()*.25+.08,a:Math.random()*6.28});
  function move(e){
    var px=e.clientX/innerWidth,py=e.clientY/innerHeight;ptr={x:e.clientX,y:e.clientY};
    st.style.setProperty('--x',e.clientX+'px');st.style.setProperty('--y',e.clientY+'px');
    st.style.setProperty('--px',(px-.5)*2);st.style.setProperty('--py',(py-.5)*2);
  }
  addEventListener('pointermove',move);addEventListener('pointerdown',move);
  function tick(t){
    x.clearRect(0,0,W,H);
    pts.forEach(function(p){
      if(!calm){p.y-=p.v;p.x+=Math.sin(t*.0004+p.a)*.15;}
      if(p.y<-5)p.y=H+5;
      p.sx=(p.x/400)*W;p.sy=p.y%(H+10);
    });
    for(var i=0;i<pts.length;i++){
      var a=pts[i],al=.18+.3*Math.abs(Math.sin(t*.0008+a.a));
      x.beginPath();x.arc(a.sx,a.sy,a.r,0,6.28);x.fillStyle='rgba(220,179,198,'+al+')';x.fill();
      for(var j=i+1;j<pts.length;j++){
        var b=pts[j],dx=a.sx-b.sx,dy=a.sy-b.sy,d=Math.sqrt(dx*dx+dy*dy);
        if(d<95){x.strokeStyle='rgba(199,149,174,'+(1-d/95)*.22+')';x.lineWidth=.6;x.beginPath();x.moveTo(a.sx,a.sy);x.lineTo(b.sx,b.sy);x.stroke();}
      }
      if(ptr){var qx=a.sx-ptr.x,qy=a.sy-ptr.y,q=Math.sqrt(qx*qx+qy*qy);
        if(q<150){x.strokeStyle='rgba(220,179,198,'+(1-q/150)*.5+')';x.lineWidth=.7;x.beginPath();x.moveTo(a.sx,a.sy);x.lineTo(ptr.x,ptr.y);x.stroke();}}
    }
    if(!calm)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  var ui=document.getElementById('ui'),hi=document.getElementById('hello'),mk=document.getElementById('mark');
  document.getElementById('go').addEventListener('click',function(){
    mk.classList.add('pulse');ui.classList.add('out');
    setTimeout(function(){window.velvetLogin&&window.velvetLogin.open();},1000);
  });
})();
</script>
<script>
(function(){
  var chat=document.getElementById('chat'),inp=document.getElementById('in'),bar=document.getElementById('bar'),eye=document.getElementById('eye'),alt=document.getElementById('alt'),
      app=document.getElementById('app'),hi=document.getElementById('hello'),login=document.getElementById('login'),ui=document.getElementById('ui'),mk=document.getElementById('mark'),data={},steps,si=0,busy=true;
  var SIGNUP=[
    {k:'name',q:['¿Quién eres?'],t:'text',p:'Tu nombre',ac:'name'},
    {k:'email',q:function(){return['Mucho gusto, '+data.name+'. ¿Dónde te escribo?']},t:'email',p:'tu@correo.com',ac:'email'},
    {k:'pass',q:['Última cosa: elige una contraseña. Será nuestro secreto.'],t:'password',p:'Mínimo 6 caracteres',ac:'new-password'}];
  var LOGIN=[
    {k:'email',q:['Qué bueno verte de nuevo. ¿Cuál es tu correo?'],t:'email',p:'tu@correo.com',ac:'email'},
    {k:'pass',q:['Y tu contraseña, por favor.'],t:'password',p:'Tu contraseña',ac:'current-password'}];
  function scroll(){chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'})}
  function row(me,html){var r=document.createElement('div');r.className='row'+(me?' me':'');
    r.innerHTML=(me?'':'<span class="av"><svg viewBox="0 0 60 60"><path d="M10 12L30 50L50 12"/></svg></span>')+html;chat.appendChild(r);scroll();return r;}
  function say(list,done){
    if(!list.length){done&&done();return;}
    var r=row(false,'<span class="b dotz"><i></i><i></i><i></i></span>');
    setTimeout(function(){var b=r.querySelector('.b');b.className='b';b.textContent=list[0];scroll();setTimeout(function(){say(list.slice(1),done)},350);},750);
  }
  function me(t){var s=document.createElement('span');s.className='b';s.textContent=t;var r=document.createElement('div');r.className='row me';r.appendChild(s);chat.appendChild(r);scroll();}
  function ask(){
    var s=steps[si],q=typeof s.q==='function'?s.q():s.q;busy=true;
    say(q,function(){inp.type=s.t;inp.placeholder=s.p;inp.autocomplete=s.ac;inp.name=s.k;inp.enterKeyHint='send';inp.value='';eye.hidden=s.t!=='password';eye.textContent='ver';busy=false;});
  }
  function bad(msg){bar.classList.remove('shake');void bar.offsetWidth;bar.classList.add('shake');if(msg){busy=true;say([msg],function(){busy=false;});}}
  function finish(){
    window.parent.postMessage({type:"velvet-auth-submit",mode:steps===SIGNUP?"signup":"signin",email:data.email,password:data.pass,name:data.name||""},window.location.origin);
  }
  window.addEventListener("message",function(event){
    if(event.origin!==window.location.origin||!event.data||event.data.type!=="velvet-auth-result")return;
    if(event.data.ok){say(["Bienvenida a Velvet."],function(){app.classList.add("out");hi.classList.add("on");});}
    else{say([event.data.message||"No pude abrir tu sesión. Inténtalo otra vez."],function(){si=steps.length-1;ask();});}
  });
  bar.addEventListener('submit',function(e){
    e.preventDefault();if(busy)return;
    var s=steps[si],v=inp.value.trim();if(!v)return bad();
    if(s.k==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return bad('Mmm, ese correo no parece real. ¿Lo revisamos?');
    if(s.k==='pass'&&v.length<6)return bad('Necesito al menos 6 caracteres para protegerte.');
    data[s.k]=v;me(s.t==='password'?'•'.repeat(Math.min(v.length,12)):v);inp.value='';
    if(++si<steps.length)ask();else{busy=true;finish();}
  });
  eye.addEventListener('click',function(){var h=inp.type==='password';inp.type=h?'text':'password';eye.textContent=h?'ocultar':'ver';});
  function start(list,hello){steps=list;si=0;data={};chat.innerHTML='';alt.hidden=!!hello;say(hello?[]:['Te estaba esperando…'],ask);}
  alt.addEventListener('click',function(){start(LOGIN,true);});
  function reset(){login.classList.remove('on');app.classList.remove('out');hi.classList.remove('on');ui.classList.remove('out');mk.classList.remove('pulse');chat.innerHTML='';}
  window.velvetLogin={open:function(){login.classList.add('on');start(SIGNUP,false);},reset:reset};
})();
</script>
<script>
(function(){
  var buttons=document.querySelectorAll("[data-lighting]");
  function apply(theme){
    if(["dark","light","comfort"].indexOf(theme)<0)return;
    document.documentElement.setAttribute("data-theme",theme);
    buttons.forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lighting===theme));});
  }
  buttons.forEach(function(b){b.addEventListener("click",function(){
    var theme=b.dataset.lighting;
    apply(theme);
    try{localStorage.setItem("velvet-theme",theme)}catch(e){}
    window.parent.postMessage({type:"velvet-theme-select",theme:theme},window.location.origin);
  });});
  window.addEventListener("message",function(e){
    if(e.origin===window.location.origin&&e.data&&e.data.type==="velvet-theme-sync")apply(e.data.theme);
  });
  try{apply(localStorage.getItem("velvet-theme")||"light")}catch(e){apply("light")}
  window.parent.postMessage({type:"velvet-theme-ready"},window.location.origin);
})();
</script>
</body>
