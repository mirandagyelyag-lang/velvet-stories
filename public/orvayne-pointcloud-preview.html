<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160813"><title>Orvayne · Prueba de partículas</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100711;color:#f7f0ed;font-family:Georgia,serif}
body{background:radial-gradient(ellipse at 50% 60%,#371a32 0%,#1c0b1e 40%,#0b0710 100%)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.brand{position:fixed;top:6%;left:0;right:0;text-align:center;pointer-events:none;letter-spacing:.25em;font-size:clamp(24px,5vw,42px);font-weight:normal;text-shadow:0 0 25px #cc819e44}
.brand small{display:block;margin-top:8px;font:11px system-ui,sans-serif;letter-spacing:.4em;color:#d9b7c4}
.bottom{position:fixed;bottom:5%;left:0;right:0;text-align:center;pointer-events:none}
.bottom p{font-style:italic;color:#d9b7c4;font-size:clamp(14px,3vw,19px);margin:0 0 15px}
.bottom span{font:10px system-ui,sans-serif;letter-spacing:.2em;color:#bc8398}
.back{position:fixed;left:20px;top:20px;z-index:5;color:#e8cbd7;font:12px system-ui,sans-serif;text-decoration:none;border:1px solid #bc83986b;padding:10px 14px;border-radius:24px;background:#210e2080}
#status{position:fixed;top:50%;left:0;right:0;text-align:center;font:12px system-ui,sans-serif;color:#d9b7c4;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body>
<a class="back" href="/">← Volver a Orvayne</a><h1 class="brand">ORVAYNE<small>EXPERIMENTO · PARTÍCULAS</small></h1><div id="status">Formando la figura…</div><div class="bottom"><p>Las historias cobran vida.</p><span>MUEVE EL CURSOR · ARRASTRA PARA GIRAR</span></div>
<script type="module">
import * as THREE from 'three';
import {PCDLoader} from 'three/addons/loaders/PCDLoader.js';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'default'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0,0);document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.01,40);
camera.position.set(0,0,1.3);
const group=new THREE.Group();scene.add(group);
let cloud=null,px=0,py=0,dragging=false,dragX=0,spin=0;
const status=document.getElementById('status');
new PCDLoader().load('https://threejs.org/examples/models/pcd/binary/Zaghetto.pcd',points=>{
 points.geometry.center();points.geometry.rotateX(Math.PI);
 points.material.size=.0042;points.material.color.set('#edb5d2');points.material.transparent=true;points.material.opacity=.9;
 points.material.depthWrite=false;cloud=points;group.add(points);status.style.display='none';
},undefined,err=>{console.error(err);status.textContent='No se pudo cargar el modelo 3D. Prueba con conexión a internet.'});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);group.scale.setScalar(innerWidth<600?.82:1)}
addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>{px=(e.clientX/innerWidth-.5)*2;py=(e.clientY/innerHeight-.5)*2;if(dragging){spin+=(e.clientX-dragX)*.008;dragX=e.clientX}});
addEventListener('pointerdown',e=>{dragging=true;dragX=e.clientX});
addEventListener('pointerup',()=>dragging=false);addEventListener('pointercancel',()=>dragging=false);
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const t=clock.getElapsedTime();if(cloud){const aim=spin+px*.16+(reduce?0:Math.sin(t*.23)*.2);group.rotation.y+=(aim-group.rotation.y)*.035;group.rotation.x+=((-py*.07)-group.rotation.x)*.035;if(!reduce){const breath=1+Math.sin(t*1.4)*.012;cloud.scale.setScalar(breath);cloud.material.opacity=.82+Math.sin(t*1.8)*.12;}}renderer.render(scene,camera)}
frame();
</script></body></html>
