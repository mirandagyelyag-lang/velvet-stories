name: Deploy ORVAYNE character-chat to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/character-chat/**"
      - ".github/workflows/deploy-character-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvayne-character-chat-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Verify Supabase token configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not configured; deployment was not attempted."
            exit 1
          fi
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy character-chat only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy character-chat --project-ref vwyudrmxatuukcbncats --no-verify-jwt
