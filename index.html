<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="velvet-version" content="2.6.11" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#722640" />
    <meta name="description" content="Private worlds and endless stories with AI characters." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Velvet Stories" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/velvet-vs-v4-favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/velvet-vs-v4-apple-180.png" />
    <title>Velvet Stories</title>

    <script>
      (() => {
        window.__VELVET_BOOT_OK__ = false;
        const safeSessionGet = (key) => { try { return sessionStorage.getItem(key); } catch { return null; } };
        const safeSessionSet = (key, value) => { try { sessionStorage.setItem(key, value); } catch {} };

        async function repair() {
          if (window.__VELVET_REPAIRING__) return;
          window.__VELVET_REPAIRING__ = true;
          try {
            if ("serviceWorker" in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.allSettled(regs.map((reg) => reg.unregister()));
            }
            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.allSettled(keys.map((key) => caches.delete(key)));
            }
          } catch {}
          safeSessionSet("velvet_boot_repaired_v269", "1");
          const url = new URL(location.href);
          url.searchParams.set("velvet_recovered", String(Date.now()));
          location.replace(url.toString());
        }

        window.__VELVET_REPAIR_APP__ = repair;

        window.addEventListener("error", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLLinkElement)) return;
          if (target.rel !== "stylesheet") return;
          if (safeSessionGet("velvet_asset_repaired_v269") === "1") return;
          safeSessionSet("velvet_asset_repaired_v269", "1");
          repair();
        }, true);

        window.setTimeout(() => {
          if (window.__VELVET_BOOT_OK__) return;
          const root = document.getElementById("root");
          if (root && root.childElementCount > 0) return;

          if (safeSessionGet("velvet_boot_repaired_v269") !== "1" && navigator.onLine) {
            repair();
            return;
          }

          const rescue = document.createElement("div");
          rescue.id = "velvet-boot-rescue";
          rescue.innerHTML = '<div><b>Velvet could not finish opening.</b><p>Your stories are safe. Repair the app cache and reopen the newest version.</p><button type="button">Repair & reopen Velvet</button></div>';
          Object.assign(rescue.style, {
            position: "fixed", inset: "0", zIndex: "2147483647", display: "grid",
            placeItems: "center", padding: "24px", background: "#f6ede4", color: "#4f363e",
            fontFamily: "system-ui, sans-serif"
          });
          const card = rescue.firstElementChild;
          Object.assign(card.style, {
            width: "min(420px,100%)", padding: "26px 20px", textAlign: "center",
            background: "#fffaf5", border: "1px solid #e3d0d2", borderRadius: "24px"
          });
          const button = rescue.querySelector("button");
          Object.assign(button.style, {
            width: "100%", minHeight: "48px", marginTop: "12px", color: "#fff",
            background: "#722640", border: "0", borderRadius: "14px", fontWeight: "700"
          });
          button.addEventListener("click", repair);
          document.body.appendChild(rescue);
        }, 5500);
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <noscript>Velvet Stories requires JavaScript to work.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
