<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="velvet-version" content="3.15.6" />
    <meta name="velvet-runtime" content="android" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#722640" />
    <meta name="description" content="Private worlds and endless stories with AI characters." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Velvet Stories" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/velvet-vs-v4-favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/velvet-vs-v4-apple-180.png" />
    <title>Velvet Stories</title>

    <style>
      html, body { margin:0; }
      html.velvet-native-prepaint, html.velvet-native-prepaint body, html.velvet-native-prepaint #root { min-height:100%; background:#16050f !important; overflow:hidden; }
      #velvet-native-prepaint { display:none; }
      html.velvet-native-prepaint #velvet-native-prepaint {
        display:block; position:fixed; inset:-1px; z-index:2147481000; pointer-events:none;
        background:#16050f url('/velvet-portal-bg.webp') center top / auto 125% no-repeat;
      }
      html.velvet-native-prepaint #velvet-native-prepaint::after {
        content:""; position:absolute; inset:0;
        background:linear-gradient(180deg,rgba(7,1,9,.01),rgba(6,1,8,.08) 56%,rgba(5,1,7,.38) 100%);
      }
    </style>

    <script>
      (() => {
        window.__VELVET_BOOT_OK__ = false;
        window.__VELVET_BOOT_ERRORS__ = [];

        const isNativeVelvet = () => {
          try {
            const runtime = document.querySelector('meta[name="velvet-runtime"]')?.content;
            return runtime === "android" ||
              Boolean(window.Capacitor?.isNativePlatform?.()) ||
              (/Android/i.test(navigator.userAgent) && location.hostname === "localhost");
          } catch {
            return false;
          }
        };

        window.__VELVET_IS_NATIVE__ = isNativeVelvet;
        if (isNativeVelvet()) document.documentElement.classList.add("velvet-native-prepaint");

        const rememberError = (value) => {
          try {
            const message =
              value?.error?.message ||
              value?.reason?.message ||
              value?.message ||
              String(value?.reason || value || "Unknown startup error");
            if (message) window.__VELVET_BOOT_ERRORS__.push(String(message).slice(0, 900));
          } catch {}
        };

        window.addEventListener("error", rememberError, true);
        window.addEventListener("unhandledrejection", rememberError);

        async function repairWebOnly() {
          if (isNativeVelvet()) {
            location.reload();
            return;
          }

          if (window.__VELVET_REPAIRING__) return;
          window.__VELVET_REPAIRING__ = true;

          try {
            if ("serviceWorker" in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.allSettled(regs.map((reg) => reg.unregister()));
            }
            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.allSettled(keys.map((key) => caches.delete(key)));
            }
          } catch {}

          const url = new URL(location.href);
          url.searchParams.set("velvet_recovered", String(Date.now()));
          location.replace(url.toString());
        }

        window.__VELVET_REPAIR_APP__ = repairWebOnly;

        // Native builds must never inherit a PWA shell. This is deliberately
        // best-effort and does not touch localStorage/session data.
        if (isNativeVelvet()) {
          Promise.resolve().then(async () => {
            try {
              if ("serviceWorker" in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.allSettled(regs.map((reg) => reg.unregister()));
              }
              if ("caches" in window) {
                const keys = await caches.keys();
                await Promise.allSettled(keys.map((key) => caches.delete(key)));
              }
            } catch {}
          });
        }

        window.setTimeout(() => {
          if (window.__VELVET_BOOT_OK__) return;

          const root = document.getElementById("root");
          if (root && root.childElementCount > 0) return;

          const native = isNativeVelvet();
          const rescue = document.createElement("div");
          rescue.id = "velvet-boot-rescue";

          const details = native
            ? (window.__VELVET_BOOT_ERRORS__.at(-1) || "Android did not finish loading the JavaScript bundle.")
            : "The web app did not finish loading.";

          const cleanDetails = String(details).replace(/[&<>"']/g, "");

          rescue.innerHTML = native
            ? `<div><b>Velvet Android could not start.</b><p>${cleanDetails}</p><button type="button">Reopen Velvet</button></div>`
            : '<div><b>Velvet could not finish opening.</b><p>Your stories are safe. Repair the web cache and reopen the newest version.</p><button type="button">Repair & reopen Velvet</button></div>';

          Object.assign(rescue.style, {
            position: "fixed", inset: "0", zIndex: "2147483647", display: "grid",
            placeItems: "center", padding: "24px", background: "#f6ede4", color: "#4f363e",
            fontFamily: "system-ui, sans-serif"
          });

          const card = rescue.firstElementChild;
          Object.assign(card.style, {
            width: "min(420px,100%)", padding: "26px 20px", textAlign: "center",
            background: "#fffaf5", border: "1px solid #e3d0d2", borderRadius: "24px"
          });

          const button = rescue.querySelector("button");
          Object.assign(button.style, {
            width: "100%", minHeight: "48px", marginTop: "12px", color: "#fff",
            background: "#722640", border: "0", borderRadius: "14px", fontWeight: "700"
          });

          button.addEventListener("click", repairWebOnly);
          document.body.appendChild(rescue);
        }, 8000);
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-BTOviJGh.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/createLucideIcon-yoQFdYqt.js">
    <link rel="modulepreload" crossorigin href="/assets/AuthContext-DwDq0Ycz.js">
    <link rel="stylesheet" crossorigin href="/assets/index-uJIP1y7M.css">
  </head>

  <body>
    <div id="velvet-native-prepaint" aria-hidden="true"></div>
    <div id="root"></div>
    <noscript>Velvet Stories requires JavaScript to work.</noscript>
  </body>
</html>
